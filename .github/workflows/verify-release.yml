name: Verify Published Release APK

# Inspects the APK that is actually attached to a GitHub Release — not a
# freshly built local copy — and reports package id, version, SDK levels and
# signer back through the REST API as a commit comment on the tagged commit.
on:
  release:
    types: [published, edited]
  # Pushing an 'apk-check-<tag>' tag re-runs verification on demand. The prefix
  # deliberately does not match the 'v*' pattern that drives release.yml.
  push:
    tags:
      - 'apk-check-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  verify:
    name: Inspect Released APK
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            # Triggered by an apk-check-<tag> tag push.
            TAG="${GITHUB_REF_NAME#apk-check-}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Verifying release $TAG"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Download Released APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'app-release.apk' \
            --dir "$RUNNER_TEMP"
          ls -lh "$RUNNER_TEMP/app-release.apk"

      - name: Inspect APK and Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$RUNNER_TEMP/app-release.apk"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt" 2>&1 || true
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" \
            > "$RUNNER_TEMP/signer.txt" 2>&1 || true

          x() { grep -oP "$1" "$RUNNER_TEMP/badging.txt" | head -n1 || true; }
          PKG=$(x "package: name='\K[^']+")
          VCODE=$(x "versionCode='\K[^']+")
          VNAME=$(x "versionName='\K[^']+")
          LABEL=$(x "application-label:'\K[^']+")
          MINSDK=$(x "sdkVersion:'\K[^']+")
          TARGETSDK=$(x "targetSdkVersion:'\K[^']+")
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIGNER=$(grep -m1 "Signer #1 certificate DN" "$RUNNER_TEMP/signer.txt" || echo "unknown")

          chk() { if [ "$2" = "$3" ]; then echo "| $1 | \`$2\` | \`$3\` | PASS |"; else echo "| $1 | \`$2\` | \`$3\` | **FAIL** |"; FAILED=1; fi; }
          FAILED=0

          {
            echo "## Published APK verification — \`${{ steps.tag.outputs.tag }}\`"
            echo
            echo "\`app-release.apk\` was downloaded from the GitHub Release and inspected with the Android build tools."
            echo
            echo "| Field | Actual | Expected | Result |"
            echo "|---|---|---|---|"
            chk "Package / application id" "$PKG" "com.shohan.khatiyan"
            chk "versionName" "$VNAME" "1.0.0"
            chk "versionCode" "$VCODE" "1"
            chk "minSdkVersion" "$MINSDK" "26"
            chk "targetSdkVersion" "$TARGETSDK" "34"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Application label | \`$LABEL\` |"
            echo "| Size | $SIZE bytes |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| $SIGNER |  |"
            echo
            echo "<details><summary>aapt2 dump badging (head)</summary>"
            echo
            echo '```'
            head -n 25 "$RUNNER_TEMP/badging.txt"
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>apksigner verify --print-certs</summary>"
            echo
            echo '```'
            head -n 40 "$RUNNER_TEMP/signer.txt"
            echo '```'
            echo "</details>"
          } | head -c 60000 > "$RUNNER_TEMP/report.md"

          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

          # Comment on the commit the release tag points at (the API needs a SHA).
          TARGET_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ steps.tag.outputs.tag }}" --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/comments" \
            -F body=@"$RUNNER_TEMP/report.md" > /dev/null || echo "::warning::could not post commit comment"

          if [ "$FAILED" != "0" ]; then
            echo "::error::Released APK identity does not match the expected release metadata."
            exit 1
          fi
          echo "All release identity assertions passed."
