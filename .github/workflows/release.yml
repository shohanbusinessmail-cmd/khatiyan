name: Khatiyan Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Release APK + GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # The repository does not ship a binary gradle-wrapper.jar, so the wrapper
      # is regenerated from the pinned Gradle distribution before any build runs.
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      # Production signing is opt-in. When the four secrets below are configured the
      # release APK is signed with the upload keystore; otherwise the build falls back
      # to the auto-generated Android debug keystore and the APK is labelled as such.
      # No key material is ever committed to this repository.
      - name: Decode Release Keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khatiyan-release.jks"
            echo "keystore_file=$RUNNER_TEMP/khatiyan-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured — APK will be production signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret is not configured. The release APK will be signed with the Android debug keystore and is NOT suitable for Play Store upload."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release APK Exists
        run: |
          set -e
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Inspect Release APK
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -n 20
          echo "----- signer -----"
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" || true
          echo "----- sha256 -----"
          sha256sum "$APK"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khatiyan-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: "খতিয়ান Release ${{ github.ref_name }}"
          body: |
            🚀 **খতিয়ান (Khatiyan) — Personal Financial & Debt Management Application**

            - **App Name:** খতিয়ান
            - **Tagline:** সব হিসাব, এক জায়গায়।
            - **Creator:** Shohan Khan (helloiamshohan@gmail.com)
            - **Language:** বাংলা (Bengali)
            - **Application ID:** `com.shohan.khatiyan`
            - **Version:** ${{ github.ref_name }} (versionCode 1)
            - **minSdk:** 26 · **targetSdk:** 34

            **Features:**
              - দোকানের বাকী ও বাজারের হিসাব (একাধিক পণ্যসহ, সম্পূর্ণ CRUD)
              - ব্যাংক ও এনজিও লোন ট্র্যাকার
              - পণ্যের ইএমআই / কিস্তি ম্যানেজমেন্ট
              - ব্যক্তিগত ধার দেনার খতিয়ান
              - দৈনিক আয় ও ব্যয়ের হিসাব
              - সম্পূর্ণ অফলাইন ও প্রাইভেট
              - JSON/CSV ব্যাকআপ ও পিডিএফ স্ট্যাটমেন্ট

            **Signing:** ${{ steps.keystore.outputs.signed == 'true' && 'Signed with the configured production upload keystore.' || '⚠️ This APK is signed with the Android **debug** keystore because the `KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS` and `KEY_PASSWORD` repository secrets are not configured. It is installable for testing but must NOT be published to Google Play.' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
