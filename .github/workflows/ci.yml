name: Khatiyan Android CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit Tests + Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # The repository does not ship a binary gradle-wrapper.jar, so the wrapper
      # is regenerated from the pinned Gradle distribution before any build runs.
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Khatiyan-Unit-Test-Report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Debug APK Exists
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khatiyan-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
