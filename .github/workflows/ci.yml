name: Khatiyan Android CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit Tests + Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # The repository does not ship a binary gradle-wrapper.jar, so the wrapper
      # is regenerated from the pinned Gradle distribution before any build runs.
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Khatiyan-Unit-Test-Report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Verify Debug APK Exists
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khatiyan-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Raw Actions logs live on blob storage that is not always reachable from
      # every environment; this mirrors the failure reason back through the
      # GitHub REST API as a commit comment so it is always retrievable.
      - name: Report Failure Diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="$RUNNER_TEMP/build.log"
          touch "$LOG"
          # Strip JVM stack-trace frames so real diagnostics stay visible.
          grep -v -E '^[[:space:]]+at [a-zA-Z0-9_.$]+\(' "$LOG" > "$RUNNER_TEMP/clean.log" || true
          {
            echo "### CI failure diagnostics — run ${GITHUB_RUN_ID}"
            echo
            echo "Kotlin / KSP / aapt2 errors:"
            echo '```'
            grep -E '^(e|w): |\.kt:[0-9]+|\.kts:[0-9]+|error:|FAILURE:|What went wrong' "$RUNNER_TEMP/clean.log" | head -n 120 || echo "(no matching lines)"
            echo '```'
            echo
            echo "<details><summary>Last 300 log lines (stack frames removed)</summary>"
            echo
            echo '```'
            tail -n 300 "$RUNNER_TEMP/clean.log"
            echo '```'
            echo "</details>"
          } | head -c 60000 > "$RUNNER_TEMP/diag.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@"$RUNNER_TEMP/diag.md" > /dev/null || true
